name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        show-progress: false
        submodules: true

    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x

    - name: Test
      run: dotnet test SteadyAchievements.Tests -c Release -p:UseAppHost=false

    - name: Build plugin
      run: dotnet build SteadyAchievements -c Release -p:ContinuousIntegrationBuild=true -p:UseAppHost=false

    - name: Package
      run: |
        set -eu
        mkdir -p out/SteadyAchievements
        cp -r SteadyAchievements/bin/Release/net10.0/SteadyAchievements.dll SteadyAchievements/bin/Release/net10.0/SteadyAchievements.deps.json SteadyAchievements/bin/Release/net10.0/www out/SteadyAchievements/
        cp LICENSE.txt NOTICE.txt out/SteadyAchievements/
        cd out
        zip -qr SteadyAchievements.zip SteadyAchievements
        sha512sum SteadyAchievements.zip > SHA512SUMS
        cat SHA512SUMS

    - name: Upload artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: SteadyAchievements
        path: |
          out/SteadyAchievements.zip
          out/SHA512SUMS

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: SteadyAchievements

    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: gh release create "$TAG" SteadyAchievements.zip SHA512SUMS --repo "$GITHUB_REPOSITORY" --title "SteadyAchievements $TAG" --generate-notes
