<!doctype html>
<html lang="tr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex">
	<title>SteadyAchievements</title>
	<link rel="icon" href="/images/logo.png">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="app" id="app">
		<header class="navbar">
			<a class="navbar__brand" href="#overview"><b>Steady</b>Achievements</a>
			<button type="button" class="navbar__button" id="menu-toggle" data-title="top.menu"><i data-icon="menu"></i></button>
			<select id="bot" class="navbar__bot" aria-label="Bot" hidden></select>
			<div class="navbar__right">
				<div class="dropdown">
					<button type="button" class="navbar__button" id="lang-toggle" data-title="top.language"><i data-icon="language"></i></button>
					<div class="dropdown__panel dropdown__panel--languages" id="lang-menu" hidden></div>
				</div>
				<div class="dropdown">
					<button type="button" class="navbar__button" id="look-toggle" data-title="top.appearance"><i data-icon="gears"></i></button>
					<div class="dropdown__panel" id="look-menu" hidden>
						<div class="dropdown__label" data-i18n="top.theme"></div>
						<div class="swatches" id="swatches"></div>
						<label class="check"><input type="checkbox" id="dark-toggle"> <span data-i18n="top.dark"></span></label>
					</div>
				</div>
				<button type="button" class="navbar__button" id="logout" data-title="top.logout"><i data-icon="logout"></i></button>
			</div>
		</header>

		<nav class="side-menu" aria-label="Menu">
			<div class="side-menu__category" data-i18n="nav.groupAchievements"></div>
			<a class="side-menu__item" href="#overview" data-tab="overview"><i data-icon="gauge"></i><span data-i18n="nav.overview"></span></a>
			<a class="side-menu__item" href="#games" data-tab="games"><i data-icon="gamepad"></i><span data-i18n="nav.games"></span></a>
			<a class="side-menu__item" href="#history" data-tab="history"><i data-icon="history"></i><span data-i18n="nav.history"></span></a>

			<div class="side-menu__category" data-i18n="nav.groupConfig"></div>
			<a class="side-menu__item" href="#settings" data-tab="settings"><i data-icon="sliders"></i><span data-i18n="nav.settings"></span></a>
			<a class="side-menu__item" href="#idle" data-tab="idle"><i data-icon="uptime"></i><span data-i18n="nav.idle"></span></a>
			<a class="side-menu__item" href="#help" data-tab="help"><i data-icon="help"></i><span data-i18n="nav.help"></span></a>

			<div class="side-menu__category">ASF</div>
			<a class="side-menu__item" href="/"><i data-icon="back"></i><span data-i18n="nav.asf"></span></a>

			<div class="side-menu__stats" id="side-stats" hidden>
				<div class="side-menu__category" data-i18n="nav.stats"></div>
				<div class="tiles">
					<div class="tile tile--green"><strong id="s-unlocked">0</strong><span id="s-unlocked-label" data-i18n="stat.unlocked"></span></div>
					<div class="tile tile--teal"><strong id="s-progress">0</strong><span data-i18n="stat.inProgress"></span></div>
					<div class="tile tile--gray"><strong id="s-completed">0</strong><span data-i18n="stat.completed"></span></div>
					<div class="tile tile--light"><strong id="s-skipped">0</strong><span data-i18n="stat.skipped"></span></div>
				</div>
				<div class="side-stat"><i data-icon="calendar"></i><span data-i18n="stat.today"></span><b id="s-today"></b></div>
				<div class="side-stat"><i data-icon="clock"></i><span data-i18n="stat.next"></span><b id="s-next"></b></div>
				<div class="side-stat"><i data-icon="flask"></i><span data-i18n="stat.mode"></span><b id="s-mode"></b></div>
				<div class="side-stat"><i data-icon="memory"></i><span data-i18n="stat.memory"></span><b id="s-memory">—</b></div>
				<div class="side-stat"><i data-icon="uptime"></i><span data-i18n="stat.uptime"></span><b id="s-uptime">—</b></div>
			</div>
		</nav>

		<main class="main-container">
			<!-- Login -->
			<section id="login" class="box box--narrow" hidden>
				<h2 class="box__title" data-i18n="login.title"></h2>
				<p class="muted" data-i18n="login.text"></p>
				<form id="login-form">
					<input id="login-password" class="form-item__input" type="password" autocomplete="current-password" placeholder="IPC password" required>
					<button type="submit" class="button button--confirm" data-i18n="login.button"></button>
				</form>
				<p id="login-error" class="text-error" hidden></p>
			</section>

			<!-- Overview -->
			<section id="tab-overview" class="tab" hidden>
				<div id="trimmed" class="notice" hidden data-i18n="status.trimmed"></div>

				<div class="info-boxes">
					<div class="info-box"><span class="info-box__icon"><i data-icon="trophy"></i></span><div><div class="info-box__label" data-i18n="info.today"></div><div class="info-box__value" id="i-today"></div></div></div>
					<div class="info-box"><span class="info-box__icon"><i data-icon="gamepad"></i></span><div><div class="info-box__label" data-i18n="info.games"></div><div class="info-box__value" id="i-games"></div></div></div>
					<div class="info-box"><span class="info-box__icon"><i data-icon="clock"></i></span><div><div class="info-box__label" data-i18n="info.next"></div><div class="info-box__value" id="i-next"></div></div></div>
				</div>

				<div class="box">
					<h3 class="box__title" data-i18n="status.summary"></h3>
					<table class="facts">
						<tr><th data-i18n="status.mode"></th><td id="f-mode"></td></tr>
						<tr><th data-i18n="status.plugin"></th><td id="f-enabled"></td></tr>
						<tr><th data-i18n="status.hours"></th><td id="f-hours"></td></tr>
						<tr><th data-i18n="status.today"></th><td id="f-today"></td></tr>
						<tr><th data-i18n="status.auto"></th><td id="f-auto"></td></tr>
					</table>
				</div>

				<div class="box">
					<h3 class="box__title" data-i18n="status.playing"></h3>
					<div id="playing"></div>
				</div>
			</section>

			<!-- Games -->
			<section id="tab-games" class="tab" hidden>
				<div class="box">
					<h3 class="box__title" data-i18n="status.games"></h3>
					<div id="games"></div>
				</div>
				<div class="box">
					<h3 class="box__title"><span data-i18n="status.completed"></span> <span id="completed-count" class="muted"></span></h3>
					<div id="completed"></div>
				</div>
			</section>

			<!-- Settings -->
			<section id="tab-settings" class="tab" hidden>
				<form id="settings-form" novalidate>
					<div class="box">
						<h3 class="box__title" data-i18n="set.run"></h3>
						<div class="form-item">
							<span class="form-item__label" data-i18n="set.mode"></span>
							<label class="radio"><input type="radio" name="mode" value="sim"> <span data-i18n="set.sim"></span></label>
							<label class="radio"><input type="radio" name="mode" value="real"> <span data-i18n="set.real"></span></label>
							<div class="form-item__description" data-i18n="set.modeHelp"></div>
						</div>
						<label class="check"><input type="checkbox" name="Enabled"> <span data-i18n="set.enabled"></span></label>
						<label class="form-item"><span class="form-item__label" data-i18n="set.language"></span>
							<select class="form-item__input input--medium" name="Language"><option value="tr">Türkçe</option><option value="en">English</option></select>
							<span class="form-item__description" data-i18n="set.languageHelp"></span>
						</label>
					</div>

					<div class="box">
						<h3 class="box__title" data-i18n="set.pace"></h3>
						<label class="form-item"><span class="form-item__label" data-i18n="set.speed"></span>
							<select class="form-item__input input--medium" name="PaceScale" data-number>
								<option value="0.5" data-i18n="set.speed.0.5"></option>
								<option value="0.75" data-i18n="set.speed.0.75"></option>
								<option value="1" data-i18n="set.speed.1"></option>
								<option value="1.5" data-i18n="set.speed.1.5"></option>
								<option value="2" data-i18n="set.speed.2"></option>
							</select>
							<span class="form-item__description" data-i18n="set.speedHelp"></span>
						</label>
						<div class="grid">
							<label class="form-item"><span class="form-item__label" data-i18n="set.from"></span><input class="form-item__input" type="time" name="from" required></label>
							<label class="form-item"><span class="form-item__label" data-i18n="set.to"></span><input class="form-item__input" type="time" name="to" required></label>
						</div>
						<p class="form-item__description" data-i18n="set.hoursHelp"></p>
						<label class="form-item"><span class="form-item__label" data-i18n="set.timeZone"></span><input class="form-item__input input--medium" type="text" name="TimeZone" placeholder="Europe/Istanbul" autocomplete="off">
							<span class="form-item__description" data-i18n="set.timeZoneHelp"></span>
						</label>
						<div class="grid">
							<label class="form-item"><span class="form-item__label" data-i18n="set.maxActive"></span><input class="form-item__input" type="number" name="MaxActiveGames" min="1" max="10"></label>
							<label class="form-item"><span class="form-item__label" data-i18n="set.maxPerDay"></span><input class="form-item__input" type="number" name="MaxPerDay" min="1" max="200"></label>
							<label class="form-item"><span class="form-item__label" data-i18n="set.minGap"></span><input class="form-item__input" type="number" name="MinGapMinutes" min="5" max="1440"></label>
							<label class="form-item"><span class="form-item__label" data-i18n="set.minPlaytime"></span><input class="form-item__input" type="number" name="MinPlaytimeHours" min="0" max="1000" step="0.5"></label>
							<label class="form-item"><span class="form-item__label" data-i18n="set.skipRarer"></span><input class="form-item__input" type="number" name="SkipRarerThan" min="0" max="50" step="0.1"></label>
						</div>
						<p class="form-item__description" data-i18n="set.paceHelp"></p>
					</div>

					<div class="box">
						<h3 class="box__title" data-i18n="set.games"></h3>
						<label class="check"><input type="checkbox" name="ExcludeVac"> <span data-i18n="set.vac"></span></label>
						<label class="check"><input type="checkbox" name="ExcludeOnline"> <span data-i18n="set.online"></span></label>
						<label class="check"><input type="checkbox" name="ProtectDlc"> <span data-i18n="set.dlc"></span></label>
						<label class="check"><input type="checkbox" name="RespectAsfBlacklist"> <span data-i18n="set.asfBlacklist"></span></label>
						<div class="form-item"><label class="form-item__label" for="f-blacklist" data-i18n="set.blacklist"></label>
							<div class="input-row"><input class="form-item__input" id="f-blacklist" type="text" name="Blacklist" inputmode="numeric" placeholder="730, 570"><button type="button" class="button" data-pick="Blacklist" data-i18n="set.pick"></button></div>
							<span class="form-item__description" data-i18n="set.blacklistHelp"></span>
							<div class="picked" data-picked="Blacklist"></div>
						</div>
						<div class="form-item"><label class="form-item__label" for="f-allowlist" data-i18n="set.allowlist"></label>
							<div class="input-row"><input class="form-item__input" id="f-allowlist" type="text" name="Allowlist" inputmode="numeric"><button type="button" class="button" data-pick="Allowlist" data-i18n="set.pick"></button></div>
							<span class="form-item__description" data-i18n="set.allowlistHelp"></span>
							<div class="picked" data-picked="Allowlist"></div>
						</div>
						<label class="form-item"><span class="form-item__label" data-i18n="set.developers"></span><input class="form-item__input" type="text" name="BlockedDevelopers" placeholder="Valve"><span class="form-item__description" data-i18n="set.namesHelp"></span></label>
						<label class="form-item"><span class="form-item__label" data-i18n="set.publishers"></span><input class="form-item__input" type="text" name="BlockedPublishers"></label>
					</div>

					<div class="box">
						<h3 class="box__title" data-i18n="set.auto"></h3>
						<label class="check"><input type="checkbox" name="AutoPlay"> <span data-i18n="set.autoPlay"></span></label>
						<p class="form-item__description" data-i18n="set.autoHelp"></p>
						<label class="form-item"><span class="form-item__label" data-i18n="set.rotate"></span><input class="form-item__input input--short" type="number" name="AutoPlayRotateHours" min="1" max="48"></label>
					</div>

					<div class="box">
						<h3 class="box__title">Discord</h3>
						<label class="form-item"><span class="form-item__label" data-i18n="set.webhook"></span><input class="form-item__input" type="url" name="DiscordWebhook" placeholder="https://discord.com/api/webhooks/..." autocomplete="off"></label>
						<label class="check"><input type="checkbox" name="NotifyCompleted"> <span data-i18n="set.nCompleted"></span></label>
						<label class="check"><input type="checkbox" name="NotifyEachUnlock"> <span data-i18n="set.nEach"></span></label>
						<label class="check"><input type="checkbox" name="NotifyDailySummary"> <span data-i18n="set.nSummary"></span></label>
						<label class="form-item"><span class="form-item__label" data-i18n="set.summaryHour"></span><input class="form-item__input input--short" type="number" name="DailySummaryHour" min="0" max="23"></label>
						<label class="check"><input type="checkbox" name="NotifyProblems"> <span data-i18n="set.nProblems"></span></label>
						<button type="button" class="button" id="test-discord" data-i18n="set.test"></button>
					</div>

					<div class="save-bar">
						<span id="save-msg" class="muted"></span>
						<button type="submit" class="button button--confirm" data-i18n="set.save"></button>
					</div>
				</form>
			</section>

			<!-- Idle games (ASF's GamesPlayedWhileIdle) -->
			<section id="tab-idle" class="tab" hidden>
				<div class="box">
					<h3 class="box__title"><span data-i18n="idle.title"></span> <span id="idle-count" class="muted"></span></h3>
					<p class="form-item__description" data-i18n="idle.help"></p>
					<div id="idle-list"></div>
					<div class="box__actions">
						<button type="button" class="button" id="idle-add" data-i18n="idle.add"></button>
					</div>
				</div>
				<div class="save-bar">
					<span id="idle-msg" class="muted"></span>
					<button type="button" class="button button--confirm" id="idle-save" data-i18n="idle.save"></button>
				</div>
			</section>

			<!-- History -->
			<section id="tab-history" class="tab" hidden>
				<div class="box">
					<h3 class="box__title" data-i18n="nav.history"></h3>
					<div id="history"></div>
				</div>
			</section>

			<!-- Help -->
			<section id="tab-help" class="tab" hidden>
				<div class="box prose" id="help"></div>
			</section>
		</main>

		<footer class="footer">
			<a href="https://github.com/JustArchiNET/ArchiSteamFarm" target="_blank" rel="noopener"><i data-icon="github"></i> ArchiSteamFarm</a>
			<a href="https://github.com/Karrp0/SteadyAchievements" target="_blank" rel="noopener"><i data-icon="github"></i> SteadyAchievements</a>
			<span class="footer__version" id="version"></span>
		</footer>
	</div>

	<dialog id="detail" class="modal">
		<div class="modal__head">
			<h3 id="detail-title"></h3>
			<button type="button" class="modal__close" id="detail-close" aria-label="Close">✕</button>
		</div>
		<div id="detail-tools" class="muted small"></div>
		<div id="detail-body"></div>
	</dialog>

	<dialog id="picker" class="modal">
		<div class="modal__head">
			<h3 data-i18n="picker.title"></h3>
			<button type="button" class="modal__close" id="picker-close" aria-label="Close">✕</button>
		</div>
		<div class="picker__tools">
			<input id="picker-search" class="form-item__input" type="search" autocomplete="off">
			<select id="picker-sort" class="form-item__input">
				<option value="playtime" data-i18n="picker.byPlaytime"></option>
				<option value="name" data-i18n="picker.byName"></option>
			</select>
		</div>
		<div id="picker-list" class="picker__list"></div>
		<div class="modal__actions">
			<span id="picker-count" class="muted picker__count"></span>
			<button type="button" value="cancel" class="button" data-i18n="picker.cancel"></button>
			<button type="button" value="ok" class="button button--confirm" data-i18n="picker.ok"></button>
		</div>
	</dialog>

	<dialog id="confirm-real" class="modal modal--small">
		<div class="modal__head"><h3 data-i18n="real.title"></h3></div>
		<p data-i18n="real.text"></p>
		<div class="modal__actions">
			<button type="button" value="cancel" class="button" data-i18n="real.cancel"></button>
			<button type="button" value="ok" class="button button--cancel" data-i18n="real.ok"></button>
		</div>
	</dialog>

	<script src="icons.js"></script>
	<script src="i18n.js"></script>
	<script src="i18n-more.js"></script>
	<script src="app.js"></script>
</body>
</html>
